name: Web
on: [push]
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        version: ['4.0.22', '5.0.7', 'latest']
    runs-on: ubuntu-latest
    container:
      image: emscripten/emsdk:${{ matrix.version }}
    continue-on-error: ${{ matrix.version == 'latest' }}
    steps:
    - uses: actions/checkout@v5
    # The newest one for this workflow, as each builds different packages from source
    - name: Restore CPM.cmake packages
      id: cpm-restore
      uses: actions/cache/restore@v6
      with:
        path: .cache/cpm
        key: cpm-${{ github.workflow }}
        restore-keys: cpm-${{ github.workflow }}-
    - name: Configure with CMake
      run: emcmake cmake -Bbuild-web -DCMAKE_COMPILE_WARNING_AS_ERROR=1
    - name: Build
      run: |
        cp -r data build-web/
        make -C build-web -j$(nproc)
    # From the directories, which CPM names after a hash of what's downloaded into them, so that
    # the cache is only saved again once something new was downloaded
    - name: Key CPM.cmake packages
      id: cpm-key
      shell: bash
      run: echo "key=cpm-$GITHUB_WORKFLOW-$(ls -d .cache/cpm/*/*/ | git hash-object --stdin)" >> "$GITHUB_OUTPUT"
    - name: Save CPM.cmake packages
      if: steps.cpm-key.outputs.key != steps.cpm-restore.outputs.cache-matched-key
      uses: actions/cache/save@v6
      with:
        path: .cache/cpm
        key: ${{ steps.cpm-key.outputs.key }}
env:
  CPM_SOURCE_CACHE: ${{ github.workspace }}/.cache/cpm
  CLICOLOR_FORCE: 1
  FORCE_COLOR: 1
