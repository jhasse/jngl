name: Linux
on: [push]
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
    - uses: actions/checkout@v5
    - name: Basic linting
      run: .github/ci.py
    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install just
        just ubuntu
    - name: Configure with CMake and GCC
      run: just cmake
    - name: Build Debug
      run: just debug all
    - name: Build Release
      run: just release all
    - name: Install unittest dependencies
      run: sudo apt install xserver-xorg-core xserver-xorg-video-dummy
    - name: Unittest
      run: |
        cd build
        Xorg -config ../data/xorg.conf &>/dev/null &
        sleep 1 # wait for Xorg to boot up
        DISPLAY=:0 ./Debug/jngl-unittest
        DISPLAY=:0 ./Release/jngl-unittest

  vulkan:
    runs-on: ubuntu-26.04
    steps:
    - uses: actions/checkout@v5
    - name: Install dependencies
      run: |
        sudo apt update
        sudo apt install just libvulkan-dev libshaderc-dev
        just ubuntu
    - name: Configure with CMake and GCC
      run: cmake -Bbuild-vulkan -GNinja -DCMAKE_BUILD_TYPE=Release -DJNGL_VULKAN=1
    - name: Build
      run: ninja -C build-vulkan
    - name: Install unittest dependencies
      # mesa-vulkan-drivers has lavapipe, which renders on the CPU
      run: sudo apt install xserver-xorg-core xserver-xorg-video-dummy mesa-vulkan-drivers
    - name: Unittest
      run: |
        cd build-vulkan
        Xorg -config ../data/xorg.conf &>/dev/null &
        sleep 1 # wait for Xorg to boot up
        DISPLAY=:0 ./jngl-unittest
