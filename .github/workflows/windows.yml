name: Windows
on: [push]
jobs:
  clang:
    runs-on: windows-2025
    steps:
    - uses: actions/checkout@v5
    - name: Cache CPM.cmake packages
      uses: actions/cache@v4
      with:
        path: .cache/cpm
        key: cpm
    - name: Configure
      run: cmake -Bbuild -G"Ninja Multi-Config" -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DCMAKE_POLICY_VERSION_MINIMUM=3.5
      shell: bash
    - name: Build (Debug)
      run: cmake --build build --config Debug
    - uses: extractions/setup-just@v2
    - name: Unittest (Debug)
      # tests like CharacterTest need OpenGL 2.0 and can't run on GitHub Actions runners
      run: just unittest-headless
    - name: Build (Release)
      run: cmake --build build --config Release
    - name: Unittest (Release)
      # tests like CharacterTest need OpenGL 2.0 and can't run on GitHub Actions runners
      run: just unittest-headless Release

  clang-cl:
    runs-on: windows-2025
    steps:
    - uses: actions/checkout@v5
    - name: Cache CPM.cmake packages
      uses: actions/cache@v4
      with:
        path: .cache/cpm
        key: cpm
    - uses: ilammy/msvc-dev-cmd@v1
    - name: Configure
      run: cmake -Bbuild -G"Ninja Multi-Config" -DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl -DCMAKE_POLICY_VERSION_MINIMUM=3.5
      shell: bash
    - name: Build (Debug)
      run: cmake --build build --config Debug
    - uses: extractions/setup-just@v2
    - name: Unittest (Debug)
      # tests like CharacterTest need OpenGL 2.0 and can't run on GitHub Actions runners
      run: just unittest-headless
    - name: Build (Release)
      run: cmake --build build --config Release
    - name: Unittest (Release)
      # tests like CharacterTest need OpenGL 2.0 and can't run on GitHub Actions runners
      run: just unittest-headless Release

  msvc:
    runs-on: windows-2025
    steps:
    - uses: actions/checkout@v5
    - name: Cache CPM.cmake packages
      uses: actions/cache@v4
      with:
        path: .cache/cpm
        key: cpm
    - name: Configure
      run: cmake -Bbuild -DCMAKE_POLICY_VERSION_MINIMUM=3.5
      shell: bash
    - name: Build (Debug)
      run: cmake --build build --config Debug
    - uses: extractions/setup-just@v2
    - name: Unittest (Debug)
      # tests like CharacterTest need OpenGL 2.0 and can't run on GitHub Actions runners
      run: just unittest-headless
    - name: Build (Release)
      run: cmake --build build --config Release
    - name: Unittest (Release)
      # tests like CharacterTest need OpenGL 2.0 and can't run on GitHub Actions runners
      run: just unittest-headless Release

  d3d12:
    runs-on: windows-2025
    steps:
    - uses: actions/checkout@v5
    - name: Cache CPM.cmake packages
      uses: actions/cache@v4
      with:
        path: .cache/cpm
        key: cpm
    - name: Install the Vulkan SDK
      # for its shader compilers, which jngl-shaderc uses at build time
      uses: jakoch/install-vulkan-sdk-action@v1
      with:
        vulkan_version: 1.4.363.0
    - name: Put the Vulkan SDK's DLLs on PATH
      run: echo "$env:VULKAN_SDK\Bin" >> $env:GITHUB_PATH
    - name: Install cja
      run: pip install git+https://github.com/jhasse/cja
    - name: Build
      run: cja build -Bbuild-d3d12 --release -DJNGL_D3D12=1
    - name: Unittest
      # on WARP, as there's no GPU
      run: |
        cd build-d3d12
        ./jngl-unittest

  mingw:
    runs-on: [ubuntu-latest]
    container:
      image: registry.fedoraproject.org/fedora-minimal:40
    steps:
    - name: Install dependencies
      run: microdnf install -y cmake ninja-build mingw64-pkg-config mingw64-libvorbis mingw64-SDL3 mingw64-fontconfig mingw64-libwebp mingw64-dlfcn mingw32-nsis mingw64-gcc-c++ tar gzip
    - uses: actions/checkout@v5
    - name: Build with CMake and GCC
      run: |
        mingw64-cmake -Bbuild-windows -DCMAKE_BUILD_TYPE=Debug -DBUILD_SHARED_LIBS=0
        cmake --build build-windows

env:
  CPM_SOURCE_CACHE: ${{ github.workspace }}/.cache/cpm
